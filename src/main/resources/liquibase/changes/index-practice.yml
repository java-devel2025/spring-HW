databaseChangeLog:

  - changeSet:
      id: create-student-name-index
      author: student
      changes:
        - sql:
            sql: CREATE INDEX idx_student_name ON student (name);

  - changeSet:
      id: create-faculty-name-color-index
      author: student
      changes:
        - sql:
            sql: CREATE INDEX idx_faculty_name_color ON faculty (name, color);